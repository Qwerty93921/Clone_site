{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment confirmation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static '/css/style1.css' %}">
</head>
<body>
    <div class="login-border">

        <form method="post" action="{% url 'payment_success' %}">
            {% csrf_token %}
            <h1 class="payment-top">Enter your credit card</h1>

            <div class="mb-3">
                <label for="card-number">Card number:</label>
                <input type="text" id="card-number" placeholder="XXXX-XXXX-XXXX-XXXX" required>
            </div>

            <div class="mb-3">
                <label for="expire-date">Expire date:</label>
                <input type="text" id="expire-date" placeholder="XX-XX" class="expire-input" required>
            </div>

            <div class="mb-3">
                <label for="cvv">CVV:</label>
                <input type="password" id="cvv" placeholder="XXX" class="cvv-input" required>
            </div>

            <button type="submit" class="btn btn-primary">Pay order</button>

        </form>
    </div>

</body>
</html>
